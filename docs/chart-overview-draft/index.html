      function render() {
        const isZiwei=chart==='ziwei';
        $('crumb').textContent=isZiwei?'紫微斗数':'奇门遁甲';$('page-title').textContent=isZiwei?'紫微命盘':'奇门遁甲';$('page-subtitle').textContent=isZiwei?'十二宫之间，读懂不同的生活面向。':'九宫有序，让神、星、门、干各归其位。';$('eyebrow').textContent=isZiwei?'ZI WEI · TWELVE PALACES':'QI MEN · NINE PALACES';$('board-count').textContent=isZiwei?'十二宫':'九宫';$('annotation-label').textContent=isZiwei?'辅星':'标记';
        const fields=!valid[chart]?[]:isZiwei?[['性别',ziweiResult.chart.gender],['出生钟表时',ziweiResult.metadata.birthCivil.slice(0,16)],['时区',ziweiResult.metadata.timeZone],['五行局',ziweiResult.chart.fiveElementsClass]]:[['北京时间',qimenResult.metadata.calculationCivil.slice(0,16)],['局式',qimenResult.juShu.fullName],['值符',qimenResult.zhiFuXing+' · '+qimenResult.zhiFuGong+'宫'],['值使',qimenResult.zhiShiMen+' · '+qimenResult.zhiShiGong+'宫']];
        $('record-strip').innerHTML=fields.map(f=>`<div class="record-item"><span>${f[0]}</span><strong>${f[1]}</strong></div>`).join('')+(valid[chart]?'<span class="sample">真实计算</span>':'');
        if(!isZiwei&&valid[chart])$('record-strip').innerHTML+=`<div class="record-item"><span>四柱</span><strong>${Object.values(qimenResult.siZhu).join(' · ')}</strong></div>`;
        document.querySelectorAll('[data-chart]').forEach(b=>{const active=b.dataset.chart===chart;b.classList.toggle('active',active);if(b.classList.contains('nav-item')){if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}else b.setAttribute('aria-pressed',String(active))});
        document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));
        $('annotation-toggle').setAttribute('aria-pressed',String(annotations));renderBoard();renderDetail();
      }
      function selectPalace(i,focus=false) {selected[chart]=i;renderBoard();renderDetail();if(focus)document.querySelector(`[data-palace="${i}"]`).focus();}
      function nav(open) {$('sidebar').classList.toggle('open',open);$('nav-mask').classList.toggle('open',open);$('open-nav').setAttribute('aria-expanded',String(open));document.body.style.overflow=open?'hidden':'';if(open)$('close-nav').focus();else $('open-nav').focus();}
      document.addEventListener('click',e=>{
        const type=e.target.closest('[data-chart]'),mode=e.target.closest('[data-view]'),cell=e.target.closest('[data-palace]'),relation=e.target.closest('[data-related]');
        if(type){chart=type.dataset.chart;annotations=false;syncForm();render();if($('sidebar').classList.contains('open'))nav(false)}
        if(mode){view=mode.dataset.view;render()}
        if(cell){selectPalace(Number(cell.dataset.palace),true)}
        if(relation){const next=Number(relation.dataset.related);selectPalace(next,!$('detail-dialog').open);if($('detail-dialog').open)$('close-detail').focus()}
      });
      $('annotation-toggle').onclick=()=>{annotations=!annotations;render()};
      $('palette').onclick=()=>{paletteIndex=(paletteIndex+1)%3;$('app').dataset.palette=['blue','lake','sunset'][paletteIndex];document.querySelector('.palette-name').textContent=['青蓝流光','湖光青绿','日落暖金'][paletteIndex]};
      $('open-nav').onclick=()=>nav(true);$('close-nav').onclick=()=>nav(false);$('nav-mask').onclick=()=>nav(false);
      $('open-detail').onclick=()=>{$('detail-dialog').showModal();document.body.style.overflow='hidden'};
      $('close-detail').onclick=()=>$('detail-dialog').close();
      $('detail-dialog').addEventListener('close',()=>{document.body.style.overflow='';$('open-detail').focus()});
      $('detail-dialog').addEventListener('click',e=>{if(e.target===$('detail-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
      document.addEventListener('keydown',e=>{
        if($('sidebar').classList.contains('open')){if(e.key==='Escape')nav(false);if(e.key==='Tab'){const controls=[$('close-nav'),...$('sidebar').querySelectorAll('nav button')];if(e.shiftKey&&document.activeElement===controls[0]){e.preventDefault();controls.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===controls.at(-1)){e.preventDefault();controls[0].focus()}}return}
        const cell=e.target.closest('[data-palace]');if(!cell||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;
        e.preventDefault();const i=Number(cell.dataset.palace),length=chart==='ziwei'?12:9;const step=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:e.key==='ArrowUp'?(chart==='qimen'?-3:-1):(chart==='qimen'?3:1);selectPalace((i+step+length)%length,true);
      });
      const wideNav=matchMedia('(min-width:1001px)');wideNav.addEventListener('change',e=>{if(e.matches&&$('sidebar').classList.contains('open')){nav(false);document.querySelector('.nav-item.active').focus()}});
      $('calculation-form').onsubmit=e=>{e.preventDefault();profiles[chart]={civil:$('civil-input').value,zone:$('zone-input').value,gender:$('gender-input').value,overlap:$('overlap-input').value};try{compute(chart);$('rule-note').textContent=ruleText();$('rule-note').classList.remove('error');}catch(error){valid[chart]=false;$('rule-note').textContent=error.message;$('rule-note').classList.add('error');}render();};
      $('calculation-form').oninput=()=>{$('rule-note').textContent='输入已修改，点击“重新排盘”更新下方结果。';};
      $('load-boundary').onclick=()=>{$('civil-input').value=chart==='ziwei'?'2023-04-05T23:00':'2026-06-21T16:24';$('zone-input').value='Asia/Shanghai';$('calculation-form').requestSubmit();};
      try{compute('ziwei');compute('qimen');}catch(error){$('rule-note').textContent=error.message;}
      syncForm();render();
    }
  </script>
</body>
</html>
